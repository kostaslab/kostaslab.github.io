  short:
    en: Builds machine-learning models for IoT security that keep working on devices and networks they have never seen.
    tr: Görmediği cihaz ve ağlarda da çalışmaya devam eden, IoT güvenliği için makine öğrenmesi modelleri geliştiriyor.
  bio:
    en:
      - Kahraman holds a PhD in Computer Science from Heriot-Watt University, Edinburgh. His thesis, “Behaviour-based Security with Machine Learning on IoT Networks” (supervised by Dr. Mike Just and Dr. Michael Lones), showed how conventional feature representations hinder model generalisation, and introduced the IoTDevID, GeMID and IoTGeM frameworks for device identification and attack detection that stay robust across unseen devices and changing network conditions.
      - During his PhD he worked as a researcher at the Huawei UK R&D Centre in Edinburgh, developing ML solutions for community detection and WiFi-based distance estimation; his team won 1st place in the Huawei UK University Challenge 2021 for indoor localisation.
      - Since September 2024 he has served as a National Education Expert at the Directorate General of Higher Education and Overseas Education (YYEGM), where he is technical lead and architect of the “Ülkem Yanımda” platform, connecting 100+ teachers with 2,000+ students in 10+ countries. He also holds an MSc in Computer Networks and Security (Distinction) from the University of Essex, and degrees in Computer Education (Marmara University) and Literature.
    tr:
      - Kahraman, Edinburgh'daki Heriot-Watt Üniversitesi'nde Bilgisayar Bilimleri alanında doktorasını tamamladı. Dr. Mike Just ve Dr. Michael Lones danışmanlığındaki “Behaviour-based Security with Machine Learning on IoT Networks” başlıklı tezinde, alışılmış öznitelik temsillerinin modellerin genellenebilirliğini nasıl kısıtladığını gösterdi; görülmemiş cihazlarda ve değişen ağ koşullarında da güvenilir kalan IoTDevID, GeMID ve IoTGeM çerçevelerini geliştirdi.
      - Doktora sürecinde Huawei UK Edinburgh Ar-Ge Merkezi'nde araştırmacı olarak topluluk tespiti ve WiFi tabanlı mesafe kestirimi üzerine çalıştı; ekibi, iç mekân konumlandırma çalışmasıyla Huawei UK University Challenge 2021'de birinci oldu.
      - Eylül 2024'ten bu yana Yükseköğretim ve Yurt Dışı Eğitim Genel Müdürlüğü'nde (YYEGM) Milli Eğitim Uzmanı olarak görev yapıyor; 10'dan fazla ülkede 100'ü aşkın öğretmeni 2.000'den fazla öğrenciyle buluşturan “Ülkem Yanımda” platformunun teknik lideri ve mimarı. Essex Üniversitesi'nde Bilgisayar Ağları ve Güvenliği yüksek lisansını (Distinction) tamamladı; Marmara Üniversitesi Bilgisayar Öğretmenliği ve Edebiyat lisans dereceleri bulunuyor.
  interests:
