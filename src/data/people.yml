  short:
    en: Uses natural language processing to measure how people retrieve words, starting with Turkish verbal fluency.
    tr: İnsanların kelimeleri nasıl hatırladığını doğal dil işleme ile ölçüyor; çıkış noktası Türkçe sözel akıcılık.
  bio:
    en:
      - Rabia completed her PhD in Informatics at the University of Edinburgh's School of Informatics (2018–2024). Her thesis, “Automatic Detection of Clusters and Switches in Turkish Semantic Verbal Fluency Data”, develops computational methods for analysing how speakers group and switch between semantic categories — a task widely used in cognitive and clinical assessment.
      - Her work sits between natural language processing, machine learning and cognitive psychology, and extends to human-computer interaction, indoor positioning and AI-driven materials research. She was a research intern at Huawei UK's Edinburgh R&D centre (2022) and a teaching assistant at the University of Edinburgh.
      - Since October 2024 she has been a lecturer in the Department of Computer Technologies at Gümüşhane University, where she teaches web programming, systems analysis and artificial intelligence, and supervises TÜBİTAK 2209-A undergraduate research projects. Before her graduate studies she taught computing for five years at the Turkish Ministry of National Education.
    tr:
      - Rabia, doktorasını Edinburgh Üniversitesi Bilişim Fakültesi'nde (School of Informatics) tamamladı (2018–2024). “Automatic Detection of Clusters and Switches in Turkish Semantic Verbal Fluency Data” başlıklı tezinde, konuşucuların anlamsal kategorileri nasıl gruplayıp aralarında nasıl geçiş yaptığını otomatik olarak çözümleyen hesaplamalı yöntemler geliştirdi; bu görev bilişsel ve klinik değerlendirmede yaygın biçimde kullanılıyor.
      - Çalışmaları doğal dil işleme, makine öğrenmesi ve bilişsel psikolojinin kesişiminde yer alıyor; insan-bilgisayar etkileşimi, iç mekân konumlandırma ve yapay zekâ destekli malzeme araştırmalarına da uzanıyor. 2022'de Huawei UK Edinburgh Ar-Ge Merkezi'nde araştırma stajyeri, Edinburgh Üniversitesi'nde ders asistanı olarak çalıştı.
      - Ekim 2024'ten bu yana Gümüşhane Üniversitesi Bilgisayar Teknolojileri Bölümü'nde öğretim görevlisi; internet programcılığı, sistem analizi ve yapay zekâ dersleri veriyor, TÜBİTAK 2209-A lisans araştırma projelerine danışmanlık yapıyor. Lisansüstü eğitiminden önce Millî Eğitim Bakanlığı'nda beş yıl bilişim öğretmenliği yaptı.
  interests:
